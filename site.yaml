  actividades:
    activa: true
    antetitulo: Elige por agua, montaña o tierra
    titulo: Nuestras actividades
    texto: "Todas con el material incluido y monitor titulado. Mira el nivel, la edad mínima y el precio por persona."
    actividades:
      - titulo: Rafting en la Noguera Pallaresa
        categoria: Agua
        texto: "El descenso clásico del Pirineo: 14 km de rápidos en balsa de seis a ocho personas."
        nivel: Iniciación
        duracion: "2 h en el río"
        edad: "Desde 12 años"
        precio: "39 €"
        temporada: "Abril a octubre"
        incluye: "Neopreno, chaqueta y escarpines; casco y chaleco; monitor titulado; fotos del descenso"
        imagen: /fotos/act-rafting.jpg
        destacado: true
        imagenes: "/fotos/hero.jpg; /fotos/galeria-1.jpg"
        detalle: |
          Es la actividad con la que empieza casi todo el mundo y la que más repite. Bajamos el tramo de Llavorsí a Sort, unos catorce kilómetros con rápidos para todos los gustos: olas grandes que mojan a toda la balsa, tramos tranquilos para mirar el valle y algún paso en el que hay que remar fuerte y a la vez.

          Cada balsa va con un monitor titulado que lleva el timón y canta las remadas. Antes de entrar al agua te equipamos en la base y te explicamos en la orilla cómo se rema, qué hacer si caes al agua y cómo se ayuda a un compañero. No hace falta experiencia, solo saber nadar y tener ganas de mojarse.

          En primavera, con el deshielo, el río baja con más caudal y el descenso es más movido. En verano el agua está más templada y es el mejor momento para ir en familia con chicos a partir de doce años. Al volver tienes duchas con agua caliente y las fotos del descenso en tu móvil.
      - titulo: Hidrospeed
        categoria: Agua
        texto: "Bajas el río tumbado sobre un trineo, con aletas y a ras de las olas."
        nivel: Medio
        duracion: "1,5 h en el río"
        edad: "Desde 14 años"
        precio: "45 €"
        temporada: "Mayo a septiembre"
        incluye: "Neopreno de 5 mm; casco, chaleco y aletas; trineo; monitor titulado"
        imagen: /fotos/act-hidrospeed.jpg
        detalle: |
          El hidrospeed es el río sin balsa: vas tumbado sobre un trineo de flotación, con las piernas en el agua y aletas para dirigirte. Sientes cada ola de frente y eres tú quien decide por dónde pasar cada rápido, siempre detrás de tu monitor.

          Empezamos en una zona tranquila para que aprendas a girar, a parar en una contracorriente y a dejarte llevar sin luchar contra el agua. Después bajamos tramos con más movimiento, en grupos pequeños para que el monitor pueda estar pendiente de todos.

          Es una actividad más física que el rafting: conviene nadar con soltura y estar en forma. El neopreno es grueso y el agua del Pirineo está fría incluso en agosto, así que nadie pasa frío. Si es tu primera vez en aguas bravas, te recomendamos empezar por el rafting y volver otro día al hidrospeed.
      - titulo: Barranquismo
        categoria: Montaña
        texto: "Saltos a pozas, toboganes de roca y rápeles junto a la cascada."
        nivel: Medio
        duracion: "3 a 4 h"
        edad: "Desde 12 años"
        precio: "49 €"
        temporada: "Junio a septiembre"
        incluye: "Neopreno y escarpines; casco y arnés; transporte al barranco; monitor titulado"
        imagen: /fotos/act-barranquismo.jpg
        imagenes: "/fotos/galeria-2.jpg"
        detalle: |
          Bajar un barranco es una mezcla de montaña y juego. Caminamos un rato hasta la cabecera y desde ahí seguimos el agua: toboganes naturales en la roca, saltos a pozas de agua clara y rápeles junto a las cascadas, con el monitor delante montando cada cuerda.

          Elegimos el barranco según el grupo y el caudal del día. Para quien empieza hay barrancos cortos con saltos pequeños y todos opcionales: si alguien no quiere saltar, siempre hay una forma de bajar andando o con cuerda.

          Te llevamos desde la base en nuestra furgoneta y te damos todo el equipo. Tú solo necesitas bañador, toalla y calzado que pueda mojarse si quieres el tuyo. Es la actividad favorita de las despedidas y de los grupos de amigos.
      - titulo: Vía ferrata
        categoria: Montaña
        texto: "Peldaños, cables y un puente colgante sobre el valle, siempre asegurado."
        nivel: Medio
        duracion: "3 h"
        edad: "Desde 10 años"
        precio: "45 €"
        temporada: "Todo el año"
        incluye: "Casco, arnés y disipador; monitor titulado; fotos en la pared"
        imagen: /fotos/act-via-ferrata.jpg
        detalle: |
          Una vía ferrata es una pared de roca preparada con peldaños, grapas y un cable de acero al que vas enganchado todo el rato. Permite subir por sitios que de otra forma serían de escaladores, con la seguridad de no soltarte nunca.

          Antes de empezar te enseñamos a usar el arnés y el disipador y a pasar los mosquetones de un tramo de cable al siguiente. El monitor va contigo y marca el ritmo. A mitad de la subida hay un puente colgante con el valle a tus pies: es la foto que todo el mundo se lleva.

          No hace falta experiencia en escalada, pero sí no tener vértigo fuerte y estar en buena forma. Se puede hacer todo el año salvo con lluvia o hielo; en verano salimos temprano para evitar el calor de la pared.
      - titulo: Kayak y canoa
        categoria: Agua
        texto: "Kayaks de dos plazas por un tramo tranquilo, ideal para familias."
        nivel: Iniciación
        duracion: "2 h"
        edad: "Desde 8 años"
        precio: "32 €"
        temporada: "Abril a octubre"
        incluye: "Kayak y pala; chaleco; bidón estanco; monitor titulado"
        imagen: /fotos/act-kayak.jpg
        detalle: |
          Es la forma tranquila de estar en el río. Usamos kayaks autovaciables de dos plazas, muy estables, en un tramo de aguas calmadas donde se rema a gusto y se puede parar a bañarse.

          El monitor os enseña a remar en pareja, a girar y a frenar, y os acompaña durante todo el recorrido. Es perfecto para hacer con niños a partir de ocho años, para quien no se anima con las aguas bravas o para descansar entre dos actividades más movidas.

          Llevad bañador, crema solar y algo de beber. El bidón estanco va incluido para que el móvil y las llaves viajen secos.
      - { titulo: Bici eléctrica de montaña, categoria: Tierra, texto: "Rutas guiadas por pistas y bordas del valle, sin sufrir en las subidas.", nivel: Iniciación, duracion: "3 h", edad: "Desde 14 años", precio: "40 €", temporada: "Todo el año", incluye: "Bici eléctrica y casco; guía; agua y barrita", imagen: /fotos/act-bici.jpg }
      - { titulo: Parque de aventura, categoria: Tierra, texto: "Puentes colgantes, tirolinas y redes entre los árboles, por colores según la edad.", nivel: Iniciación, duracion: "2 h", edad: "Desde 6 años", precio: "22 €", temporada: "Semana Santa a octubre", incluye: "Arnés y casco; explicación de seguridad; monitores en el circuito", imagen: /fotos/act-parque.jpg }

